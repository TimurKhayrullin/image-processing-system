data_handling:
  max_db_size_mb: 10240 
  t_size_check_period: 30        # seconds (e.g., __ minutes)
  insert_count_size_check: 10000   # check after every __ inserts

database:
  host: "127.0.0.1"
  port: 5432
  name: "telemetry"
  user: "postgres"
  password: "mypass"


